[package]
name = "kontra-plugin"
version = "3.0.0-dev"
edition.workspace = true
license = "Apache-2.0"
description = "KONTRA v3: the plugin shell over kontra-host and kontra-ui (CLAP, VST3)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]

[dependencies]
kontra-align = {path = "../crates/app/align"}
kontra-host = {path = "../crates/app/host", features = ["align"]}
kontra-protocol = {path = "../crates/model/protocol"}
kontra-ui = {path = "../crates/app/ui"}
kontra-ui-model = {path = "../crates/model/ui-model"}
dirs = "5"
kontra-library = {path = "../crates/app/library"}
moose = {default-features = false, features = ["mui"], path = "../vendor/moose"}
moose-clap = {features = ["mpe-input"], optional = true, path = "../vendor/moose-clap"}
moose-vst3 = {optional = true, path = "../vendor/moose-vst3"}
clap-sys = {version = "0.5", optional = true}
mui-native-dialog = {features = ["xdg-portal"], path = "../vendor/mui-native-dialog"}

[dev-dependencies]
moose-test = {path = "../vendor/moose-test"}
