[package]
name = "contra-host"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
contra-engine = { path = "../../engine/engine" }
contra-prepare = { path = "../../engine/prepare" }
contra-format = { path = "../../format/common" }
contra-format-kontakt = { path = "../../format/kontakt" }
contra-ksp = { path = "../../script/ksp" }
contra-library = { path = "../library" }
contra-protocol = { path = "../../model/protocol" }
contra-stream = { path = "../../engine/stream" }
contra-ui-model = { path = "../../model/ui-model" }
dirs = "5"
serde.workspace = true
serde_json = "1"
contra-align = { path = "../align", optional = true }

[features]
align = ["dep:contra-align"]

[[example]]
name = "align"
required-features = ["align"]
