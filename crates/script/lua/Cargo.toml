[package]
name = "contra-lua"
version = "0.0.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Luau for Kontakt 8 native_ui pages (the only Lua CONTRA runs)"

[lints]
workspace = true

[dependencies]
contra-ui-model = { path = "../../model/ui-model" }
mlua = { version = "=0.12.2", features = ["luau", "send"] }
rlsf = "0.2.3"

[features]
# Leave the global allocator to the binary (the host's heap example).
system-allocator = []
