[package]
name = "contra-stream"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
bytemuck = {version = "1", features = ["extern_crate_alloc", "zeroable_atomics"]}
contra-ir = {path = "../../model/ir"}
contra-protocol = {path = "../../model/protocol"}
ncw = {path = "../../../vendor/ncw"}
symphonia = {version = "0.5", default-features = false, features = ["flac"]}
crossbeam-queue = {workspace = true}

[target.'cfg(unix)'.dependencies]
rustix = {version = "1", default-features = false, features = ["fs", "std"]}
