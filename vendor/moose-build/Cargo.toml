[package]
name = "moose-build"
description = "Build-time helper that reads moose.toml and emits plugin metadata as compile-time environment variables"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
homepage = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[dependencies]
toml = {version = "1"}
serde = {version = "1", features = ["derive"]}
moose-utils = {version = "7.0.0", path = "../moose-utils"}
base64 = {version = "0.22"}

