[package]
name = "mui-weld"
description = "Bounded, renderer-independent distance-field material welding for MUI"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
# Colour interchange with mui-style and peniko (both `color` types).
# The one Point/Vec2/Rect the workspace uses.
color = {version = "0.3"}
kurbo = {version = "0.13.1"}
rustc-hash = {version = "2"}

