[package]
name = "moose-baseview"
# Derived from baseview v0.4.1 API/behavior (8c6e6bab), preserving owned native backends.
# See UPSTREAM.md for the exhaustive forward-port and downstream deviations.
version = "0.4.1-moose.1"
authors = [
    "William Light <git@wrl.lhiaudio.com>",
    "Charles Saracco <crsaracco@gmail.com>",
    "Mirko Covizzi <mrkcvzz@gmail.com>",
    "Micah Johnston <micah@glowcoil.com>",
    "Billy Messenger <billydm@protonmail.com>",
    "Anton Lazarev <https://antonok.com>",
    "Joakim Frostegård <joakim.frostegard@gmail.com>",
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
    "Adrien Prokopowicz <prokopylmc@gmail.com>"
]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Low-level windowing system geared towards making audio plugin UIs."
keywords = ["windowing", "audio", "plugin"]
categories = ["gui"]
repository = "https://github.com/Matari-Audio/moose"

rust-version = "1.86"

[features]
default = []
opengl = []

[dependencies]
matari-audio-drag-and-drop = {path = "../matari-audio-drag-and-drop"}
keyboard-types = {version = "0.8.3"}
raw-window-handle = "0.6.2"
dpi = "0.1.2"
tracing = {version = "0.1", optional = true}

[target.'cfg(target_os="linux")'.dependencies]
xim = {package = "zed-xim", features = ["x11rb-client", "x11rb-xcb"], path = "../xim-rs"}
libc = "0.2"
x11rb = {version = "0.13.2", features = ["cursor", "randr", "resource_manager", "allow-unsafe-code", "dl-libxcb"], default-features = false}
xkbcommon-dl = {version = "0.4.2", features = ["x11"]}
x11-dl = {version = "2.21.0"}
calloop = "=0.14.4" # 0.14.5 raises MSRV to 1.86.
percent-encoding = "2.3.2"
bytemuck = {version = "1.25.2", features = ["extern_crate_alloc"]}
smithay-client-toolkit = "0.21.1"
wayland-client = {version = "0.31.14", features = ["system"]}
wayland-protocols = {version = "0.32.12", features = ["client", "staging", "unstable"]}
calloop-wayland-source = "0.4.1"

[lints.clippy]
missing-safety-doc = "allow"

allow-attributes-without-reason = "warn"
arithmetic-side-effects = "warn"
clone-on-ref-ptr = "warn"
dbg-macro = "warn"
default-union-representation = "deny"
deref-by-slicing = "warn"
doc-paragraphs-missing-punctuation = "warn"
empty-drop = "warn"
empty-enum-variants-with-brackets = "warn"
empty-structs-with-brackets = "warn"
error-impl-error = "warn"
exhaustive-enums = "warn"
exit = "deny"
expect-used = "warn"
float-cmp-const = "warn"
get-unwrap = "warn"
indexing-slicing = "warn"
integer-division = "warn"
lossy-float-literal = "warn"
non-zero-suggestions = "warn"
print-stderr = "warn"
print-stdout = "warn"
todo = "warn"
try-err = "warn"
unnecessary-safety-comment = "warn"
unwrap-used = "warn"


[package.metadata.docs.rs]
all-features = true

# Standalone vendored package: native cfg checks must not build the MUI workspace.
[[test]]
name = "mac_drag_geometry"
path = "tests/mac_drag_geometry.rs"
harness = false

[dev-dependencies]
softbuffer = {version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"]}
