[package]
name = "mui-baseview"

# A native window: nothing here builds for wasm.
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
[features]
# Native integration-fixture event queue; never enabled by ordinary builds.
test-support = ["mui/test-support"]
# Explicitly accepts that a plugin panic can terminate its DAW.
allow-panic-abort = []

[dependencies]
matari-audio-drag-and-drop = {path = "../matari-audio-drag-and-drop"}
mui = {features = ["gpu-quad", "software-window"], path = "../mui"}
baseview = {package = "moose-baseview", path = "../moose-baseview"}
keyboard-types = {version = "0.8", default-features = false}
# baseview's handles; the same 0.6 wgpu takes.
raw-window-handle = "0.6"
# mui-vello picks no backend; the window that owns the device does.
wgpu = {version = "30", default-features = false, features = ["static-dxc", "std", "wgsl", "vulkan", "gles", "metal", "dx12"]}

# Frame skipping and view anchoring on macOS (src/platform.rs); baseview
# already pulls it in there.
mui-access = {path = "../mui-access"}
[target.'cfg(target_os = "linux")'.dependencies]
mui-winit = {path = "../mui-winit"}
winit = "0.30"
arboard = {version = "3.6", default-features = false}
# AT-SPI; screen bounds borrow baseview's original X11 connection below.
accesskit_unix = {path = "../accesskit_unix"}
x11-dl = "2.21"
x11rb = {version = "0.13.2", default-features = false, features = ["allow-unsafe-code", "dl-libxcb"]}

[dev-dependencies]
epaint_default_fonts = {version = "0.36"}
