[package]
name = "moose-gpu"
description = "GPU rendering backend (wgpu) for moose plugins"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
homepage = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[dependencies]
moose-core = {version = "7.0.0", path = "../moose-core"}
moose-font = {version = "7.0.0", features = ["raster"], path = "../moose-font"}
moose-gui-types = {version = "7.0.0", path = "../moose-gui-types"}
moose-params = {version = "7.0.0", path = "../moose-params"}
wgpu = {version = "29", default-features = false, features = ["wgsl"]}
bytemuck = {version = "1", features = ["derive"]}
pollster = "0.4"
lyon_tessellation = "1"
raw-window-handle = "0.6"
log = "0.4"

# baseview is the macOS/Windows/Linux windowing layer; iOS embeds
# wgpu surfaces directly in a UIView attached to the AUv3 view
# controller, so the baseview-bound editor here is gated off the
# iOS build. `moose-gpu` only uses baseview indirectly through
# `WgpuBackend::from_window` (a baseview::Window parameter).
[target.'cfg(not(target_os = "ios"))'.dependencies]
baseview = {package = "moose-baseview", version = "0.3.4-moose.1", path = "../moose-baseview"}

# wgpu backend features, gated per OS so the macOS / Windows builds
# don't drag in the Linux Vulkan + GLES stacks (and vice versa).
# Cargo unifies the feature set across the dep graph in a workspace
# build, so most downstream wgpu users (moose-gui, moose-egui,
# moose-slint, etc.) inherit the right backend without restating
# it. The exception is `cargo publish --verify`, which compiles a
# single crate against its declared deps only — sibling crates'
# feature unification doesn't apply. Any crate whose source
# references a backend-gated symbol (e.g. `SurfaceTargetUnsafe::
# CoreAnimationLayer`) needs to declare the backend feature on its
# own dep line; see `moose-egui/Cargo.toml` for the pattern.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = {version = "29", default-features = false, features = ["wgsl", "vulkan", "gles"]}

[features]
default = []
hot-debug = []

