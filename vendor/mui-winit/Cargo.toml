[package]
name = "mui-winit"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[features]
default = []
external-xdnd = ["winit/external-xdnd"]

[dependencies]
# Reuse the plugin-image pin rather than duplicating loader FFI.
baseview = {package = "moose-baseview", default-features = false, path = "../moose-baseview"}
mui = {features = ["gpu-quad", "software-window"], path = "../mui"}
wgpu = {version = "30", default-features = false, features = ["static-dxc", "std", "default"]}
winit = "0.30"
accesskit_winit = {path = "../accesskit_winit"}
arboard = {version = "3.6", default-features = false, features = ["wayland-data-control"]}
mui-access = {path = "../mui-access"}

[dev-dependencies]
epaint_default_fonts = {version = "0.36"}

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = {version = "0.13", default-features = false}

[[example]]
name = "external_xdnd"
required-features = ["external-xdnd"]

