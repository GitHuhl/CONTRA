[package]
name = "mui"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[features]
default = []
# Opt-in native integration-fixture hooks, omitted from shipping builds.
test-support = ["mui-vello/test-support"]
gpu-quad = ["mui-vello/gpu-quad"]
cpu = ["mui-vello/cpu"]
cpu-threads = ["mui-vello/cpu-threads"]
software-window = ["mui-vello/software-window"]

[dependencies]
color = {version = "0.3"}
mui-scene = {path = "../mui-scene"}
mui-material = {path = "../mui-material"}
mui-motion = {path = "../mui-motion"}
mui-layout = {path = "../mui-layout"}
mui-geometry = {path = "../mui-geometry"}
mui-input = {path = "../mui-input"}
rustc-hash = {version = "2"}
mui-text = {path = "../mui-text"}
mui-vello = {path = "../mui-vello"}
unicode-segmentation = {version = "1.13"}

[dev-dependencies]
libc = "0.2"
epaint_default_fonts = {version = "0.36"}
png = {version = "0.18"}
ttf-inter = {version = "0.1", default-features = false, features = ["v"]}

[[example]]
name = "snapshot"
required-features = ["cpu"]

[[example]]
name = "motion_strip"
required-features = ["cpu"]
# The scale contract is asserted where it is demonstrated, so the example and
# the test cannot drift apart.
test = true

[[example]]
name = "large_lists"
required-features = ["cpu"]

[[example]]
name = "semantic_gallery"
required-features = ["cpu"]
