[package]
name = "moose-gui-utils"
description = "Host-side platform helpers shared by moose GUI backends (macOS NSView anchoring, etc)."
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
homepage = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[dependencies]
# `HasWindowHandle` appears in the public function signatures on every
# platform (the non-macOS stubs are no-ops but still take the type),
# so this dep stays unconditional. `objc` is only needed for the
# macOS impl, so it's behind a target gate below.
raw-window-handle = "0.6"

