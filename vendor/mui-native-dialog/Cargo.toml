[package]
name = "mui-native-dialog"
description = "Cancellable, parented Linux desktop portal file dialogs"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[features]
default = []
xdg-portal = ["dep:async-channel", "dep:tokio", "dep:futures-lite", "dep:url", "dep:zbus"]

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = {version = "2.5", optional = true}
tokio = {version = "1", features = ["rt", "net", "time"], optional = true}
futures-lite = {version = "2.6", optional = true}
url = {version = "2.5", optional = true}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

