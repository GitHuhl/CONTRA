[package]
name = "moose"
description = "Audio plugin framework - write once, build CLAP, VST3, AU v2, AU v3, and a standalone host binary"
keywords = ["audio", "plugin", "vst", "clap", "midi"]
categories = ["multimedia::audio"]
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
homepage = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[dependencies]
moose-core = {version = "7.0.0", path = "../moose-core"}
# `moose-gui-types` carries the lightweight layout / interaction /
# render / theme types the prelude exports. `moose-plugin` carries
# the `PluginLogic` leaf traits. Neither pulls a renderer - the
# choice of renderer (moose-gui, moose-egui)
# is a per-plugin Cargo dep, used inside the plugin's
# `PluginLogic::editor()` impl.
moose-gui-types = {version = "7.0.0", path = "../moose-gui-types"}
moose-plugin = {version = "7.0.0", path = "../moose-plugin"}
moose-params = {version = "7.0.0", path = "../moose-params"}
moose-loader = {version = "7.0.0", path = "../moose-loader"}
moose-derive = {version = "7.0.0", path = "../moose-derive"}
moose-clap = {version = "7.0.0", optional = true, path = "../moose-clap"}
moose-vst3 = {version = "7.0.0", optional = true, path = "../moose-vst3"}
moose-mui = {version = "7.0.0", optional = true, path = "../moose-mui"}

[features]
default = ["clap"]
clap = ["dep:moose-clap"]
vst3 = ["dep:moose-vst3"]
# MUI editors (`moose::mui`): `MuiEditor` and the parameter `Bridge`.
mui = ["dep:moose-mui"]
shell = ["moose-loader/shell"]
hot-debug = ["moose-loader/hot-debug"]
# Paranoid real-time allocation checking (dev/test). Enables the check in
# `process`; install the allocator at your crate root with
# `moose::enable_rt_paranoid!()`.
rt-paranoid = ["moose-core/rt-paranoid"]

