name: cull tags

# One-off, run by hand from the Actions tab: deletes every tag.
# Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to remove every tag
        required: true

permissions:
  contents: write

jobs:
  cull:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete every tag
        run: |
          git ls-remote --tags --refs origin | awk '{print $2}' > tags.txt
          echo "Deleting $(wc -l < tags.txt) tags"
          if [ -s tags.txt ]; then xargs -n 50 git push origin --delete < tags.txt; fi
          echo "Left:"
          git ls-remote --tags origin
