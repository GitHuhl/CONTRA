[profile.release]
panic = "unwind"
lto = "thin"
strip = "symbols"

# The corpus-health scoreboard: release code, with function names kept so a
# panic is recorded as crate::module::fn (cargo build --profile corpus).
[profile.corpus]
inherits = "release"
strip = "none"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[profile.dsp-dev]
inherits = "dev"
opt-level = 1

# Explicit ThinLTO profile for comparisons with maxperf.
[profile.thin]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.minsize]
inherits = "maxperf"
opt-level = "s"

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }

[workspace]
members = ["tools/inspect", "tools/ui-shots", "tools/contra-window", "crates/app/align", "crates/app/face", "crates/app/host", "crates/app/library", "crates/app/ui", "crates/app/ui-pictures", "crates/app/ui-view", "crates/base/law", "crates/base/fastlz", "crates/base/macros", "crates/base/time", "crates/dsp/core", "crates/dsp/delay", "crates/dsp/drive", "crates/dsp/dynamics", "crates/dsp/eq", "crates/dsp/filter", "crates/dsp/modulators", "crates/dsp/registry", "crates/dsp/reverb", "crates/dsp/spatial", "crates/engine/behaviour", "crates/engine/effects", "crates/engine/engine", "crates/engine/ledger", "crates/engine/plan", "crates/engine/prepare", "crates/engine/racks", "crates/engine/script-ui", "crates/engine/stream", "crates/engine/trace", "crates/engine/vm", "crates/engine/voice", "crates/format/common", "crates/format/kontakt", "crates/format/kontakt-effects", "crates/model/events", "crates/model/ir", "crates/model/params", "crates/model/protocol", "crates/model/ui-model", "crates/script/ksp", "plugin", "tools/clap-probe", "tools/vst3-probe", "crates/script/lua"]
exclude = ["vendor/ni-file", "vendor/ncw", "vendor/symphonia-format-riff", "vendor/symphonia-bundle-flac", "vendor/accesskit_unix", "vendor/accesskit_winit", "vendor/matari-audio-drag-and-drop", "vendor/moose-baseview", "vendor/moose-build", "vendor/moose-clap", "vendor/moose-core", "vendor/moose-cpu", "vendor/moose-derive", "vendor/moose-driver", "vendor/moose-font", "vendor/moose-gpu", "vendor/moose-gui-types", "vendor/moose-gui-utils", "vendor/moose-gui", "vendor/moose-loader", "vendor/moose-mui", "vendor/moose-params", "vendor/moose-plugin", "vendor/moose-standalone", "vendor/moose-test", "vendor/moose-utils", "vendor/moose-vst3", "vendor/moose", "vendor/mui-access", "vendor/mui-baseview", "vendor/mui-geometry", "vendor/mui-headless", "vendor/mui-input", "vendor/mui-layout", "vendor/mui-material", "vendor/mui-motion", "vendor/mui-native-dialog", "vendor/mui-scene", "vendor/mui-style", "vendor/mui-symbols", "vendor/mui-text", "vendor/mui-vello", "vendor/mui-weld", "vendor/mui-winit", "vendor/mui", "vendor/vello_cpu", "vendor/xim-rs"]
resolver = "3"

[workspace.package]
edition = "2024"

# Versions match Cargo.lock today. Later v3 tasks depend on these with `workspace = true`.
[workspace.dependencies]
mui = {path = "vendor/mui"}
mui-headless = {path = "vendor/mui-headless"}
mui-native-dialog = {path = "vendor/mui-native-dialog"}
moose = {default-features = false, path = "vendor/moose"}
moose-clap = {path = "vendor/moose-clap"}
moose-vst3 = {path = "vendor/moose-vst3"}
moose-test = {path = "vendor/moose-test"}
moose-standalone = {path = "vendor/moose-standalone"}
thiserror = "2"
smallvec = "1"
serde = {version = "1", features = ["derive"]}
toml = "1"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
syn = {version = "2", features = ["derive", "parsing", "printing", "proc-macro"]}
quote = "1"
proc-macro2 = "1"

# New v3 crates inherit these (`[lints] workspace = true`). Old crates keep their own lints until they move.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# Optimized CI keeps release semantics while avoiding cross-crate ThinLTO.
[profile.ci]
inherits = "release"
lto = false

# Local "release-like" iteration (09-BUILD.md). Shipping, CI and benchmarks use release/maxperf.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = "none"
debug = "line-tables-only"
