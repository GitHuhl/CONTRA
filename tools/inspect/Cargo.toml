[package]
name = "contra-inspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "Inspect v3 instrument loads and playback"

[dependencies]
anyhow = "1"
hound = "3"
contra-engine = { path = "../../crates/engine/engine", features = ["trace"] }
contra-ui-model = { path = "../../crates/model/ui-model" }
contra-law = { path = "../../crates/base/law" }
contra-host = { path = "../../crates/app/host" }
contra-stream = { path = "../../crates/engine/stream" }
serde_json = "1"
rustfft = "6"
